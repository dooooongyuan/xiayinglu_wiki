name: Update Steam news

on:
  schedule:
    # GitHub uses UTC. This is approximately 09:17 in China Standard Time.
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-steam-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: wiki/.nvmrc
          cache: npm
          cache-dependency-path: wiki/package-lock.json

      - name: Install dependencies
        working-directory: wiki
        run: npm ci

      - name: Fetch Steam announcements
        working-directory: wiki
        run: npm run news:update -- --strict

      - name: Detect content changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- wiki/src/data/steam-news.generated.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate updated data
        if: steps.changes.outputs.changed == 'true'
        working-directory: wiki
        run: npm run check

      - name: Commit and push updated announcements
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wiki/src/data/steam-news.generated.json
          git commit -m "chore: update Steam announcements"
          git push
